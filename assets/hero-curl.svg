<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 940" width="620" height="940" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.34" stop-color="#F1EEE8"/>
      <stop offset="0.62" stop-color="#E2DED5"/>
      <stop offset="1" stop-color="#F8F6F2"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAF7"/>
      <stop offset="1" stop-color="#E9E6DE"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#C9C4B8" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.4" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#6B6354" stop-opacity=".30"/>
      <stop offset="1" stop-color="#6B6354" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- the shadow the lifted sheet casts on the page behind it -->
  <ellipse cx="250" cy="640" rx="250" ry="210" fill="url(#shade)" filter="url(#blur)"/>
  <path d="M-10 430 C80 560 230 650 360 700 C260 720 120 700 -10 640 Z" fill="#6B6354" opacity=".16" filter="url(#blur)"/>
  <!-- the sheet's own surface, the part still lying flat -->
  <path d="M-10 -10 L130 -10 C170 150 150 330 -10 430 Z" fill="url(#under)"/>
  <!-- the curled flap -->
  <path d="M130 -10 C330 20 480 190 520 380 C548 520 470 650 340 700 C250 600 150 520 80 430 C30 360 -10 330 -10 240 L-10 -10 Z" fill="url(#flap)"/>
  <!-- underside of the roll: the lighter band along the free edge -->
  <path d="M520 380 C548 520 470 650 340 700 C400 600 440 470 400 330 C380 250 330 170 250 110 C410 170 500 270 520 380 Z" fill="url(#under)" opacity=".92"/>
  <!-- rim light on the roll -->
  <path d="M250 110 C330 170 380 250 400 330 C440 470 400 600 340 700" fill="none" stroke="url(#roll)" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M130 -10 C330 20 480 190 520 380 C548 520 470 650 340 700" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="2.5" stroke-linecap="round"/>
</svg>
